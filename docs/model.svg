<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .hid  { fill:#eef0fb; stroke:#4a5aa8; stroke-width:1.4; }
    .ext  { fill:#ececec; stroke:#888;    stroke-width:1.4; }
    .obs  { fill:#ffffff; stroke:#666;    stroke-width:1.2; }
    .lbl  { font-size:13px; fill:#111; text-anchor:middle; }
    .slbl { font-size:12px; fill:#111; text-anchor:middle; }
    .edge { stroke:#333; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .dash { stroke:#333; stroke-width:1.4; fill:none; marker-end:url(#a);
            stroke-dasharray:5 4; }
    .note { font-size:11px; fill:#555; text-anchor:middle; font-style:italic; }
    .cap  { font-size:11px; fill:#333; text-anchor:middle; }
  </style>

  <!-- hidden chain -->
  <rect class="hid" x="52"  y="136" width="90" height="34" rx="4"/>
  <text class="lbl" x="97"  y="158">X_i(t-1)</text>

  <rect class="hid" x="266" y="136" width="90" height="34" rx="4"/>
  <text class="lbl" x="311" y="158">X_i(t)</text>

  <rect class="hid" x="480" y="136" width="90" height="34" rx="4"/>
  <text class="lbl" x="525" y="158">X_i(t+1)</text>

  <!-- neighbour chain -->
  <rect class="ext" x="52"  y="32"  width="90" height="34" rx="4"/>
  <text class="lbl" x="97"  y="54">X_j(t-1)</text>
  <text class="note" x="97" y="22">room-mate on shift t-1</text>

  <!-- observations -->
  <rect class="obs" x="45"  y="248" width="104" height="30" rx="4"/>
  <text class="slbl" x="97"  y="268">pcr_i(t)</text>

  <rect class="obs" x="196" y="248" width="104" height="30" rx="4"/>
  <text class="slbl" x="248" y="268">rapid_i(t)</text>

  <rect class="obs" x="308" y="248" width="100" height="30" rx="4"/>
  <text class="slbl" x="358" y="268">temp_i(t)</text>

  <rect class="obs" x="418" y="248" width="120" height="30" rx="4"/>
  <text class="slbl" x="478" y="268">symptom_i(t)</text>

  <!-- transitions -->
  <path class="edge" d="M142,153 L262,153"/>
  <path class="edge" d="M356,153 L476,153"/>

  <!-- contact coupling -->
  <path class="edge" d="M142,55 C200,60 235,105 272,138"/>
  <text class="note" x="286" y="76">β · P(X_j = I)</text>

  <!-- delayed PCR emission -->
  <path class="dash" d="M97,170 L97,244"/>
  <text class="note" x="150" y="212">one-shift delay</text>

  <!-- same-shift emissions -->
  <path class="edge" d="M300,172 L256,244"/>
  <path class="edge" d="M316,172 L352,244"/>
  <path class="edge" d="M330,172 L455,244"/>

  <text class="cap" x="320" y="300">Figure 1 — One slice of the factorial HMM (chain i, with one coupled neighbour j).</text>
</svg>
